[package]
name = "texcraft-web"
description = "TeXCraft in the browser (eframe web runner)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
texcraft-engine = { workspace = true, default-features = false }
texcraft-ui-egui = { workspace = true }
texcraft-compile = { workspace = true }
log = { workspace = true }

[[bin]]
name = "texcraft-web"
path = "src/main.rs"

[[bin]]
name = "engine-worker"
path = "src/bin/engine-worker.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window", "Document", "HtmlCanvasElement", "Element", "Event", "EventTarget", "BeforeUnloadEvent", "Response",
    "DragEvent", "DataTransfer", "Url", "HtmlAnchorElement", "HtmlElement", "DataTransferItemList", "DataTransferItem", "FileList", "File", "Blob", "AddEventListenerOptions",
    "FileSystemEntry", "FileSystemDirectoryEntry", "FileSystemFileEntry", "FileSystemDirectoryReader",
    "IdbFactory", "IdbOpenDbRequest", "IdbRequest", "IdbDatabase", "IdbObjectStore", "IdbTransaction", "IdbTransactionMode", "IdbKeyRange", "DomException", "DomStringList",
    "Location", "History", "Storage", "StorageEvent", "Navigator", "StorageManager", "StorageEstimate", "HtmlInputElement",
] }
js-sys = "0.3"
serde_json = { workspace = true }
rfd = { version = "0.17.2", default-features = false }
egui = { workspace = true }
