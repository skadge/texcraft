[package]
name = "texcraft"
description = "TeXCraft for the desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
texcraft-engine = { workspace = true, features = ["retex", "templates-download"] }
texcraft-compile = { workspace = true, features = ["retex"] }
texcraft-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links"] }
log = { workspace = true }
craft-settings = { workspace = true }
craft-dialogs = { workspace = true }
craft-quit = { workspace = true }
craft-control = { workspace = true }
serde_json = { workspace = true }
getrandom = { workspace = true }
dirs = { workspace = true }
chrono = { workspace = true }
env_logger = { workspace = true }
# ui.screenshot's PNG.
png = "0.18"
serde = { workspace = true }
egui = { workspace = true }

# The system menu bar (craft-menu's AppKit backend, through muda).
[target.'cfg(target_os = "macos")'.dependencies]
craft-menu = { workspace = true }
