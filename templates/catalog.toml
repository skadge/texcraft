# TeXCraft's template catalogue (docs/plan.md, phase 1, item 2b). TeXCraft's own data, under the
# repository's licence. The templates themselves are not here: they are downloaded from their
# source, checked, and kept in the user's data folder.
#
# A `texlive` template is a set of files from the documentation of a TeX Live package, which
# comes from a TeX Live mirror and is checked against TeX Live's signed package database. `files`
# are paths inside the package's documentation folder (doc/latex/<package>/); `main` is the one
# compiled. `licence` is the package's, as CTAN's catalogue gives it; the user sees it before
# creating a project. Templates are taken from the TeX Live year installed (so they match its
# classes); `aliases` lists a file's names in other years.

[[template]]
id = "elsevier-num"
title = "Elsevier journal article (numbered references)"
publisher = "Elsevier"
category = "journal"
source = { texlive = "elsarticle" }
files = ["elsarticle-template-num.tex"]
main = "elsarticle-template-num.tex"
licence = "LPPL-1.3"

