# TeXCraft is on gitlab.com for now, so its CI is here rather than in craft-common-actions'
# GitHub workflows. One job runs the same sequence as `cargo xtask ci` locally: fmt, clippy with
# warnings as errors, the tests, the layering check and the wasm32 build.

stages:
  - check

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"
  CARGO_TERM_COLOR: always
  # The interface faces come from craft-fonts; the build works without them, so CI tests both the
  # fallback (no checkout) and nothing more.
  CRAFT_FONTS_DIR: ""

check:
  stage: check
  image: rust:1.95-bookworm
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libfontconfig1-dev libgtk-3-dev mesa-vulkan-drivers
    - rustup component add clippy rustfmt
    - rustup target add wasm32-unknown-unknown
  script:
    - cargo xtask ci
  cache:
    key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo-home/registry
      - .cargo-home/git
      - target/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
