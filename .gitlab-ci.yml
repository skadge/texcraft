# TeXCraft is on gitlab.com for now, so its CI is here rather than in craft-common-actions'
# GitHub workflows.
#
# Merge requests and branches other than the default: `check` runs the same sequence as `cargo
# xtask ci` locally (fmt, clippy with warnings as errors, the tests, the layering check and the
# wasm32 build). A push to the default branch runs only `mirror` (CI time is scarce); `check` and
# the package jobs run there when a pipeline is started by hand (Build › Pipelines › Run pipeline, or the API)
# pipeline).
#
# Every push to the default branch and every release tag is mirrored to GitHub (`mirror`), and a
# release is also made there (`github-release`), with the same notes and the same files. Both use
# GITHUB_RELEASE_TOKEN, a fine-grained token with Contents read and write on skadge/texcraft,
# kept in a masked and protected CI variable (so on protected refs only: main and v*).
#
# Tags vX.Y.Z (docs/releasing.md): `check`, then the packages (AppImage, Flatpak bundle, browser
# build), then `publish` uploads them to the project's generic package registry and `release`
# makes the GitLab release from the version's CHANGELOG.md section. `pages` puts the browser build
# on GitLab Pages once `web` succeeds, with the user guide (docs/guide/) at /guide/. Nothing publishes from a branch: on the default branch the package
# jobs can be started by hand, and their files stay job artifacts.

stages:
  - check
  - package
  - publish
  - release

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"
  CARGO_TERM_COLOR: always
  # Incremental builds help nothing in CI (each job starts from the cache, not the last edit) and
  # make target/, and so every cache upload and download, much larger.
  CARGO_INCREMENTAL: "0"
  # The interface faces come from craft-fonts; the build works without them, so `check` tests the
  # fallback (no checkout). The packages embed them (CRAFT_FONTS_REQUIRED in their jobs).
  CRAFT_FONTS_DIR: ""
  # storytold/craft-fonts for the packages. Keep it equal to the commit in
  # packaging/flatpak/io.gitlab.severin_lemaignan.TeXCraft.yml.
  CRAFT_FONTS_REV: 26a79230872f9b2acd3dd68500677e294350ab94
  # The tools the package jobs download, each pinned by version and SHA-256. An empty SHA-256 stops
  # the job and prints the download's checksum, to be checked against the release page and pinned
  # here (packaging/ci/fetch-pinned.sh).
  APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
  # The runtime embedded in the AppImage (static, needs no libfuse2 on the user's system), from its
  # dated release 20251108 rather than the rolling "continuous" one.
  APPIMAGE_RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
  APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
  # Trunk for the browser build, from crates.io (whose checksums Cargo checks), at the version
  # used locally. Trunk then fetches the wasm-bindgen matching Cargo.lock and binaryen's wasm-opt.
  TRUNK_VERSION: 0.22.0
  # Trunk 0.22 needs a newer Rust than the workspace's (rust-toolchain.toml); it is installed with
  # this toolchain only, and the app is still built with the workspace's.
  TRUNK_RUST: 1.96.1
  # retex's engine for the browser (cargo xtask retex-wasm): a dated nightly and wasi-sdk.
  RETEX_WASM_TOOLCHAIN: nightly-2026-10-22
  WASI_SDK: "34"
  # Where `publish` puts the files: the generic package registry, one package version per tag.
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/texcraft"

# The system libraries the desktop crates build against.
.desktop-deps: &desktop-deps
  - apt-get update -qq
  - apt-get install -y -qq --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libfontconfig1-dev libgtk-3-dev

# craft-fonts at CRAFT_FONTS_REV, for builds that embed the interface faces.
# The runner keeps a folder of its own across jobs (/ci-cache, a volume of its config.toml): each
# job's target/, cargo's downloads and the toolchains stay there, warm, instead of GitLab's cache
# zipping several GB after every job and unzipping them before the next. The paths the builds use
# (target/, .cargo-home, .rustup-home) are links into it, so nothing else changes. A target folder
# over 60 GB is started again (cargo never removes what it no longer needs). Without the volume,
# the jobs build from nothing.
.persist: &persist
  - |
    if [ -d /ci-cache ]; then
      for d in "target-$CI_JOB_NAME" "cargo-home-$CI_JOB_NAME" "rustup-$CI_JOB_NAME"; do mkdir -p "/ci-cache/$d"; done
      if [ "$(du -s --block-size=1G "/ci-cache/target-$CI_JOB_NAME" | cut -f1)" -gt 60 ]; then rm -rf "/ci-cache/target-$CI_JOB_NAME"/*; fi
      rm -rf target .cargo-home .rustup-home
      ln -s "/ci-cache/target-$CI_JOB_NAME" target
      ln -s "/ci-cache/cargo-home-$CI_JOB_NAME" .cargo-home
      ln -s "/ci-cache/rustup-$CI_JOB_NAME" .rustup-home
      du -sh "/ci-cache/target-$CI_JOB_NAME" || true
    else
      echo "No /ci-cache volume: building without a cache."
    fi

.fetch-fonts: &fetch-fonts
  - git init -q craft-fonts
  - git -C craft-fonts fetch -q --depth 1 https://github.com/storytold/craft-fonts "$CRAFT_FONTS_REV"
  - git -C craft-fonts checkout -q FETCH_HEAD

# The package jobs: on a release tag, and by hand in a pipeline started by hand on the default
# branch (without blocking it). They wait for `check` (stage order).
.package-rules:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(web|api)$/
      when: manual
      allow_failure: true

# The caches (cargo's downloads and target/) are shared by every branch and tag, one per job:
# a key per ref would give each release tag an empty cache and a build of every dependency.

# The image has a full, current TeX Live, for the tests that build with retex (exports,
# formulas: retex 2.5 needs a recent one, and the `preview` package); Rust is installed into it,
# as in `web`.
check:
  stage: check
  image: texlive/texlive:latest
  variables:
    RUSTUP_HOME: "$CI_PROJECT_DIR/.rustup-home"
  before_script:
    - *persist
    - *desktop-deps
    - apt-get install -y -qq --no-install-recommends mesa-vulkan-drivers curl ca-certificates gcc libc6-dev git
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
    - export PATH="$CARGO_HOME/bin:$PATH"
    - rustup show active-toolchain || rustup toolchain install
    - rustup component add clippy rustfmt
    - rustup target add wasm32-unknown-unknown
  script:
    - cargo xtask ci
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE !~ /^(web|api)$/
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# The default branch and release tags, pushed to the GitHub mirror as they are pushed here. A full
# clone: GitHub refuses pushes from a shallow one. Not forced: a push GitHub does not have the
# history for fails, and says so.
mirror:
  stage: check
  image: alpine:3.22
  needs: []
  variables:
    GIT_DEPTH: 0
  script:
    - apk add --no-cache -q git
    - test -n "$GITHUB_RELEASE_TOKEN" || { echo "GITHUB_RELEASE_TOKEN is not set (or this ref is not protected)"; exit 1; }
    - REMOTE="https://x-access-token:${GITHUB_RELEASE_TOKEN}@github.com/skadge/texcraft.git"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        git push "$REMOTE" "refs/tags/$CI_COMMIT_TAG:refs/tags/$CI_COMMIT_TAG"
      else
        git push "$REMOTE" "$CI_COMMIT_SHA:refs/heads/$CI_COMMIT_BRANCH"
      fi
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"

# A release tag must match Cargo.toml's version, the changelog and the metainfo; the release's
# description is the changelog's section, kept for `release`.
release-notes:
  stage: check
  image: alpine:3.22
  script:
    - packaging/ci/release-notes.sh "$CI_COMMIT_TAG" > release-notes.md
    - echo "VERSION=${CI_COMMIT_TAG#v}" > release.env
  artifacts:
    paths:
      - release-notes.md
    reports:
      dotenv: release.env
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# The AppImage, built on Debian 12 so that it runs on glibc 2.36 and newer (the job prints the
# oldest glibc the binaries need). The faces are embedded; translations are not (English only).
appimage:
  stage: package
  image: rust:1.95-bookworm
  extends: .package-rules
  # Built while `check` runs, not after it: publishing waits for both (publish's and pages' needs).
  needs:
    - job: release-notes
  variables:
    CRAFT_FONTS_DIR: "$CI_PROJECT_DIR/craft-fonts"
    CRAFT_FONTS_REQUIRED: "1"
  before_script:
    - *persist
    - *desktop-deps
    - apt-get install -y -qq --no-install-recommends desktop-file-utils binutils
    - *fetch-fonts
    - mkdir -p tools
    - packaging/ci/fetch-pinned.sh "$APPIMAGETOOL_URL" "$APPIMAGETOOL_SHA256" tools/appimagetool.AppImage
    - packaging/ci/fetch-pinned.sh "$APPIMAGE_RUNTIME_URL" "$APPIMAGE_RUNTIME_SHA256" tools/runtime-x86_64
    # Extracted rather than mounted: the job's container has no FUSE.
    - chmod +x tools/appimagetool.AppImage
    - (cd tools && ./appimagetool.AppImage --appimage-extract >/dev/null)
  script:
    - cargo build --release --locked -p texcraft -p texcraft-cli
    - VERSION="${CI_COMMIT_TAG#v}"
    - APPIMAGETOOL="$CI_PROJECT_DIR/tools/squashfs-root/AppRun" RUNTIME_FILE="$CI_PROJECT_DIR/tools/runtime-x86_64" VERSION="${VERSION:-$(git describe --tags --always)}" packaging/appimage/build-appimage.sh "$CI_PROJECT_DIR/out"
    - (cd out && sha256sum *.AppImage | tee SHA256SUMS-appimage)
    # The same binaries go into the Flatpak (its job's prebuilt/), instead of a second build.
    - mkdir -p out/bin && cp target/release/texcraft target/release/texcraft-cli out/bin/
  artifacts:
    paths:
      - out/*.AppImage
      - out/SHA256SUMS-appimage
      - out/bin/
    expire_in: 30 days

# The Flatpak bundle. flatpak-builder needs user namespaces for bubblewrap, which a Docker
# container has only when the runner runs it privileged: GitLab.com's hosted Linux runners do
# (they also run Docker-in-Docker); a self-hosted runner needs `privileged = true`. rofiles-fuse
# is turned off, there being no FUSE in the container. The build tools are Debian's
# flatpak-builder; the cargo sources are generated by flatpak-cargo-generator from Flathub's
# org.flatpak.Builder (signed through the Flathub remote), which also lints the manifest and the
# built repository.
flatpak:
  stage: package
  image: debian:trixie
  extends: .package-rules
  # Packages the AppImage job's binaries (prebuilt/, see the manifest) rather than building them
  # again in the Flatpak SDK.
  needs:
    - job: appimage
      artifacts: true
  variables:
    FLATPAK_ID: io.gitlab.severin_lemaignan.TeXCraft
    # Only the Mesa GL extension: the runner's host has an NVIDIA GPU, and with its driver's
    # extension installed too, flatpak (1.16.6) fails to set up the runtime ("Extension
    # org.freedesktop.Platform.GL.default has invalid merge-dirs") in two runs out of three.
    FLATPAK_GL_DRIVERS: default
    MANIFEST: packaging/flatpak/io.gitlab.severin_lemaignan.TeXCraft.yml
  before_script:
    # The runtime, the SDK and the Builder stay installed in /ci-cache (several GB, downloaded
    # once), with flatpak-builder's state and cargo's target folder (through --ccache, see the
    # manifest), and apt's downloads.
    - |
      if [ -d /ci-cache ]; then
        mkdir -p /ci-cache/flatpak-user /ci-cache/flatpak-builder /ci-cache/apt-trixie
        export FLATPAK_USER_DIR=/ci-cache/flatpak-user
        rm -rf .flatpak-builder && ln -s /ci-cache/flatpak-builder .flatpak-builder
        echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' > /etc/apt/apt.conf.d/10keep
        rm -rf /var/cache/apt/archives && ln -s /ci-cache/apt-trixie /var/cache/apt/archives
        mkdir -p /ci-cache/apt-trixie/partial
      fi
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends flatpak flatpak-builder git ca-certificates elfutils debugedit appstream
    - flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
    - flatpak --user install -y --noninteractive --or-update flathub org.flatpak.Builder
    - flatpak --user info org.flatpak.Builder | sed -n 's/^ *\(Version\|Commit\):/\1:/p'
  script:
    - VERSION="${CI_COMMIT_TAG#v}"; VERSION="${VERSION:-$(git describe --tags --always)}"
    - mkdir -p prebuilt && cp out/bin/texcraft out/bin/texcraft-cli prebuilt/
    - flatpak run --command=flatpak-cargo-generator --filesystem="$CI_PROJECT_DIR" org.flatpak.Builder "$CI_PROJECT_DIR/Cargo.lock" -o "$CI_PROJECT_DIR/packaging/flatpak/cargo-sources.json"
    - flatpak-builder --user --disable-rofiles-fuse --install-deps-from=flathub --force-clean --ccache --repo=flatpak-repo flatpak-build "$MANIFEST"
    # Lint findings are shown, not fatal: some (the app id's domain, the home folder) are decisions
    # for the operator (docs/releasing.md).
    - flatpak run --command=flatpak-builder-lint --filesystem="$CI_PROJECT_DIR" org.flatpak.Builder manifest "$CI_PROJECT_DIR/$MANIFEST" || true
    - flatpak run --command=flatpak-builder-lint --filesystem="$CI_PROJECT_DIR" org.flatpak.Builder repo "$CI_PROJECT_DIR/flatpak-repo" || true
    - mkdir -p out
    - flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo flatpak-repo "out/TeXCraft-$VERSION-x86_64.flatpak" "$FLATPAK_ID"
    - (cd out && sha256sum *.flatpak | tee SHA256SUMS-flatpak)
  artifacts:
    paths:
      - out/*.flatpak
      - out/SHA256SUMS-flatpak
      # The generated sources, for a Flathub submission or to rebuild by hand.
      - packaging/flatpak/cargo-sources.json
    expire_in: 30 days

# The browser build (apps/texcraft-web) with Trunk, in the size-optimised `web` profile. Its
# public_url is "./", so the files work from any folder, a Pages subpath included. The site
# carries its own TeX tree (`cargo xtask tree-site`), chosen with the TeX Live of the image, as
# retex's Pages job does: Rust is installed into it (rust-toolchain.toml names the version).
web:
  stage: package
  image: texlive/texlive:latest
  extends: .package-rules
  # A new retex version compiles it twice (the browser's module and the native one that builds the
  # tree's seed) before the tree is made: more than an hour on a busy runner.
  timeout: 90m
  # Not after `check`: it is the longest job. A release still waits for `check`, through
  # `publish`'s other needs (appimage, flatpak).
  needs: []
  variables:
    CRAFT_FONTS_DIR: "$CI_PROJECT_DIR/craft-fonts"
    CRAFT_FONTS_REQUIRED: "1"
    RUSTUP_HOME: "$CI_PROJECT_DIR/.rustup-home"
  before_script:
    - *persist
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends curl ca-certificates gcc libc6-dev git xz-utils
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
    - export PATH="$CARGO_HOME/bin:$PATH"
    - *fetch-fonts
    - rustup show active-toolchain || rustup toolchain install
    - rustup target add wasm32-unknown-unknown
    # cargo install puts trunk in $CARGO_HOME/bin, the project's .cargo-home (cached), not the
    # image's own cargo folder that is on PATH.
    - export PATH="$CARGO_HOME/bin:$PATH"
    - rustup toolchain install "$TRUNK_RUST" --profile minimal
    # The cache keeps trunk's binary but not cargo's record of it: installed only when the cached
    # one is not the pinned version.
    - trunk --version 2>/dev/null | grep -qF "$TRUNK_VERSION" || cargo +"$TRUNK_RUST" install --locked --force trunk --version "$TRUNK_VERSION"
    - rustup toolchain install "$RETEX_WASM_TOOLCHAIN" --profile minimal --component rust-src --target wasm32-wasip1
    - curl -sSfL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-$WASI_SDK/wasi-sdk-$WASI_SDK.0-x86_64-linux.tar.gz" | tar xz -C /opt
    - export WASI_SDK_PATH=/opt/wasi-sdk-$WASI_SDK.0-x86_64-linux
  script:
    - VERSION="${CI_COMMIT_TAG#v}"; VERSION="${VERSION:-$(git describe --tags --always)}"
    # The engine the web build runs (target/retex-wasm/retex.wasm, copied by Trunk).
    - cargo xtask retex-wasm
    - (cd apps/texcraft-web && trunk build --release)
    # The templates, which the page fetches from its own site (TeX Live's mirrors send no CORS
    # headers): after Trunk, which replaces dist/web.
    - cargo xtask templates-site dist/web
    # The TeX tree and its seed (a native retex of the pinned version, built into
    # target/retex-native and cached with target/).
    - cargo xtask tree-site dist/web --bundle
    - du -sh dist/web dist/web/tree
    - mkdir -p out
    - tar -C dist -czf "out/texcraft-web-$VERSION.tar.gz" web
    - (cd out && sha256sum *.tar.gz | tee SHA256SUMS-web)
  artifacts:
    paths:
      - dist/web/
      - out/*.tar.gz
      - out/SHA256SUMS-web
    expire_in: 30 days

# Uploads the packages and their checksums to the generic package registry, under the tag's
# version. Only on a release tag.
publish:
  stage: publish
  image: curlimages/curl:8.10.1
  needs:
    - job: release-notes
    - job: appimage
    - job: flatpak
    - job: web
    - job: check
      artifacts: false
      optional: true
  script:
    # The image runs as an unprivileged user, so the joined list is written outside the checkout.
    - cat out/SHA256SUMS-* > /tmp/SHA256SUMS
    - |
      for file in out/*.AppImage out/*.flatpak out/*.tar.gz /tmp/SHA256SUMS; do
        echo "uploading $(basename "$file")"
        curl --fail-with-body --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$file" "$PACKAGE_REGISTRY_URL/$VERSION/$(basename "$file")"
      done
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# The GitLab release of the tag: the changelog's section as its description, and links to the
# uploaded files. VERSION comes from release-notes' dotenv report.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:v0.20.0
  needs:
    - job: release-notes
    - job: publish
  script:
    - echo "Releasing TeXCraft $VERSION"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "TeXCraft $VERSION"
    description: release-notes.md
    assets:
      links:
        - name: "TeXCraft-$VERSION-x86_64.AppImage"
          url: "$PACKAGE_REGISTRY_URL/$VERSION/TeXCraft-$VERSION-x86_64.AppImage"
          link_type: package
        - name: "TeXCraft-$VERSION-x86_64.flatpak"
          url: "$PACKAGE_REGISTRY_URL/$VERSION/TeXCraft-$VERSION-x86_64.flatpak"
          link_type: package
        - name: "texcraft-web-$VERSION.tar.gz (browser build)"
          url: "$PACKAGE_REGISTRY_URL/$VERSION/texcraft-web-$VERSION.tar.gz"
          link_type: package
        - name: SHA256SUMS
          url: "$PACKAGE_REGISTRY_URL/$VERSION/SHA256SUMS"
          link_type: other
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# The same release on GitHub (skadge/texcraft): the changelog's section with links to this
# release and its files here, and the files themselves attached. Run again, it replaces the files.
github-release:
  stage: release
  image: alpine:3.22
  needs:
    - job: release-notes
    - job: appimage
    - job: flatpak
    - job: web
    - job: publish
      artifacts: false
    - job: mirror
      artifacts: false
  variables:
    GH_REPO: skadge/texcraft
  script:
    - apk add --no-cache -q github-cli
    - export GH_TOKEN="$GITHUB_RELEASE_TOKEN"
    - cat out/SHA256SUMS-* > SHA256SUMS
    - |
      {
        cat release-notes.md
        echo
        echo "Built and published on GitLab: ${CI_PROJECT_URL}/-/releases/${CI_COMMIT_TAG}"
        echo
        for file in out/*.AppImage out/*.flatpak out/*.tar.gz SHA256SUMS; do
          echo "- [$(basename "$file")](${PACKAGE_REGISTRY_URL}/${VERSION}/$(basename "$file"))"
        done
      } > github-notes.md
    - |
      if gh release view "$CI_COMMIT_TAG" > /dev/null 2>&1; then
        gh release edit "$CI_COMMIT_TAG" --title "TeXCraft $VERSION" --notes-file github-notes.md
        gh release upload "$CI_COMMIT_TAG" --clobber out/*.AppImage out/*.flatpak out/*.tar.gz SHA256SUMS
      else
        gh release create "$CI_COMMIT_TAG" --verify-tag --title "TeXCraft $VERSION" --notes-file github-notes.md \
          out/*.AppImage out/*.flatpak out/*.tar.gz SHA256SUMS
      fi
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# GitLab Pages: the browser build at the project's Pages address, put up whenever `web` succeeds
# (on a release tag, or in a pipeline started by hand on the default branch).
pages:
  stage: release
  image: alpine:3.22
  needs:
    - job: web
    - job: check
      artifacts: false
      optional: true
  script:
    - rm -rf public
    - cp -r dist/web public
    # The user guide (static HTML and CSS) at /guide/, next to the editor; its pictures are the
    # README's, referenced as ../images/ from the guide, so they go to /images/.
    - cp -r docs/guide public/guide
    - cp -r docs/images public/images
    # The engine's files of the version being replaced, so that a page opened before this deploy
    # (or the browser's cached copy of it) still finds its engine; they are named after their
    # contents, so they never clash with the new ones. Only the version just before is kept.
    - apk add --no-cache curl
    - |
      old=$(curl -fsS "$CI_PAGES_URL/" | sed -n 's/.*name="texcraft-engine" content="engine-worker-\([0-9a-f]\{16\}\)_loader\.js".*/\1/p' | head -n 1) || old=""
      if [ -n "$old" ] && [ ! -e "public/retex-$old.wasm" ]; then
        for f in "engine-worker-${old}_loader.js" "engine-worker-${old}.js" "engine-worker-${old}_bg.wasm" "retex-${old}.wasm"; do
          curl -fsS -o "public/$f" "$CI_PAGES_URL/$f" || { echo "could not keep $f"; rm -f "public/$f"; }
        done
      fi
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(web|api)$/
