[package]
name = "xtask"
description = "Repository checks for TeXCraft (cargo xtask): layering, the wasm build, the CI sequence"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde_json = { workspace = true }
# `cargo xtask templates`: fetches every template of the catalogue (network) and builds it.
texcraft-templates = { workspace = true, features = ["download"] }
# `cargo xtask icons`: renders the app icon's SVG master (Apache-2.0 OR MIT).
resvg = { version = "0.48", default-features = false, features = ["raster-images"] }
