[package]
name = "texcraft-ui-egui"
description = "The TeXCraft interface in egui: file panel, editor, PDF preview and build log"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
texcraft-engine = { workspace = true, default-features = false }
texcraft-latex = { workspace = true }
texcraft-preview = { workspace = true }
texcraft-templates = { workspace = true }
craft-i18n = { workspace = true }
craft-ui = { workspace = true }
craft-keymap = { workspace = true }
egui_extras = { workspace = true, features = ["svg"] }
egui = { workspace = true, features = ["monochrome_emoji_fonts"] }
serde_json = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
# Decodes the app icon for the top bar, the start page and About.
png = "0.18"

# Installed fonts after the bundled ones, for characters they lack (newer emoji, rare scripts), and
# colour glyphs (colour emoji); desktop only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-ui = { workspace = true, features = ["system_fonts", "color_fonts"] }

[build-dependencies]
craft-fonts-build = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true }
texcraft-compile = { workspace = true, default-features = false }
egui = { workspace = true, features = ["default_fonts"] }
