[package]
name = "texcraft-compile"
description = "Builds a TeXCraft project into a PDF: the backend trait, the retex backend and a background worker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["retex"]
# The in-process retex engine (desktop and CLI). The web build leaves it out until the WASI engine
# host lands (docs/plan.md, phase 3).
retex = ["dep:retex"]

[dependencies]
texcraft-project = { workspace = true }
serde = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
retex = { workspace = true, optional = true }
