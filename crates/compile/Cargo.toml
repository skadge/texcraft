[package]
name = "texcraft-compile"
description = "Builds a TeXCraft project into a PDF: the backend trait, the retex backend and a background worker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["retex"]
# The in-process retex engine (desktop and CLI). The web build leaves it out until the WASI engine
# host lands (docs/ROADMAP.md).
retex = ["dep:retex"]

[dependencies]
serde_json = { workspace = true }
texcraft-project = { workspace = true }
serde = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
texcraft-wasi = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Worker", "MessageEvent", "DedicatedWorkerGlobalScope", "WorkerGlobalScope", "XmlHttpRequest", "XmlHttpRequestResponseType", "Response", "Performance", "Crypto", "CacheStorage", "Cache", "Request", "ResponseInit", "Headers", "RequestInit", "RequestCache", "WorkerLocation"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
retex = { workspace = true, optional = true }
