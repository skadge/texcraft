[package]
name = "texcraft-engine"
description = "The TeXCraft session: the open project, its builds, the command registry every frontend goes through, and confined file access for agents"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["retex"]
retex = ["texcraft-compile/retex"]
# Downloading templates from TeX Live (desktop and CLI).
templates-download = ["texcraft-templates/download"]

[dependencies]
texcraft-project = { workspace = true }
base64 = "0.22"
texcraft-latex = { workspace = true }
texcraft-compile = { workspace = true, default-features = false }
texcraft-templates = { workspace = true }
texcraft-buffer = { workspace = true }
texcraft-review = { workspace = true }
texcraft-history = { workspace = true }
texcraft-forge = { workspace = true }
chrono = { workspace = true }
getrandom = { workspace = true }
ed25519-dalek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
retex-lsp = { workspace = true }
retex-synctex = { workspace = true }
log = { workspace = true }
# Line diffs of a file's versions (history.diff).
similar = { version = "3", default-features = false, features = ["std", "text"] }
# AI assistance (docs/ROADMAP.md, AI1, AI2): the suite's connection, consent and request-log model.
craft-ai-core = { workspace = true }
craft-ai = { workspace = true }
# Spelling (docs/ROADMAP.md, E11): the suite's proofing library.
craft-proof = { workspace = true }
# Zip files: an export with pictures downloaded in the browser, and zips dropped or imported
# (`file.unzip`), read with its limits.
craft-zip = { workspace = true }

# Files a save removes from the project's folder and its history does not hold go to the
# system's trash (issue #2).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
trash = "5"
# The AI token in the system's keychain (the suite's one keychain namespace).
craft-suite-account = { workspace = true }

# The clock and the random source of new review ids, in the browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { workspace = true, features = ["wasmbind"] }
getrandom = { workspace = true, features = ["wasm_js"] }

[dev-dependencies]
# A fake model behind the suite's provider trait: tests never reach a network.
craft-ai = { workspace = true }
texcraft-templates = { workspace = true }
texcraft-compile = { workspace = true, default-features = false }
serde_json = { workspace = true }
