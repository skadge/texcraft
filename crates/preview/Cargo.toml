[package]
name = "texcraft-preview"
description = "PDF pages to pixels for the preview pane, through craft-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
craft-pdf = { workspace = true }
kurbo = { workspace = true }
retex-image = { workspace = true }
resvg = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
png = { workspace = true }
# egui's bundled faces (Hack, Ubuntu), the fonts the browser build draws SVG text with when built
# without craft-fonts.
epaint_default_fonts = "0.37"
