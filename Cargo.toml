[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/texcraft", "apps/texcraft-cli", "xtask"]

[workspace.package]
version = "0.26.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://gitlab.com/severin-lemaignan/texcraft"

[workspace.dependencies]
# Shared Craft libraries, all at one craft-libs `main` rev (AGENTS.md rule 10).
craft-pdf = { git = "https://github.com/storytold/craft-libs", rev = "f8c3cef36fbf8f735b373b66c4f81911993aba1f", default-features = false, features = ["raster"] }
craft-i18n = { git = "https://github.com/storytold/craft-libs", rev = "f8c3cef36fbf8f735b373b66c4f81911993aba1f" }
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "f8c3cef36fbf8f735b373b66c4f81911993aba1f" }
craft-fonts-build = { git = "https://github.com/storytold/craft-libs", rev = "f8c3cef36fbf8f735b373b66c4f81911993aba1f" }
craft-dialogs = { git = "https://github.com/storytold/craft-libs", rev = "f8c3cef36fbf8f735b373b66c4f81911993aba1f" }
craft-quit = { git = "https://github.com/storytold/craft-libs", rev = "f8c3cef36fbf8f735b373b66c4f81911993aba1f", features = ["egui"] }
craft-keymap = { git = "https://github.com/storytold/craft-libs", rev = "f8c3cef36fbf8f735b373b66c4f81911993aba1f", features = ["egui", "ui"] }
craft-control = { git = "https://github.com/storytold/craft-libs", rev = "f8c3cef36fbf8f735b373b66c4f81911993aba1f" }
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "f8c3cef36fbf8f735b373b66c4f81911993aba1f" }
craft-zip = { git = "https://github.com/storytold/craft-libs", rev = "f8c3cef36fbf8f735b373b66c4f81911993aba1f" }
craft-mcp-server = { git = "https://github.com/storytold/craft-libs", rev = "f8c3cef36fbf8f735b373b66c4f81911993aba1f" }
craft-menu = { git = "https://github.com/storytold/craft-libs", rev = "f8c3cef36fbf8f735b373b66c4f81911993aba1f" }
# Showing a file in the system's file manager (`process::reveal`, sandbox-aware), desktop only.
craft-update = { git = "https://github.com/storytold/craft-libs", rev = "f8c3cef36fbf8f735b373b66c4f81911993aba1f" }
# Spelling and suggestions per language (docs/ROADMAP.md, E11).
craft-proof = { git = "https://github.com/storytold/craft-libs", rev = "f8c3cef36fbf8f735b373b66c4f81911993aba1f" }
# The suite's AI layer: connections, consent and the request log (craft-ai-core, all targets), the
# OpenAI-compatible provider (craft-ai, desktop), and the suite's keychain for the token.
craft-ai-core = { git = "https://github.com/storytold/craft-libs", rev = "f8c3cef36fbf8f735b373b66c4f81911993aba1f" }
craft-ai = { git = "https://github.com/storytold/craft-libs", rev = "f8c3cef36fbf8f735b373b66c4f81911993aba1f" }
craft-suite-account = { git = "https://github.com/storytold/craft-libs", rev = "f8c3cef36fbf8f735b373b66c4f81911993aba1f" }

# The typesetting engine and language server (CC0-1.0), from crates.io. What later releases add for
# TeXCraft is in retex's docs/design/embedding.md (and docs/retex-changes.md here).
retex = "2.6"
retex-lsp = "2.6"
# The bibliography's entries (keys, authors, years) for the formatted view's citations.
retex-bib = "2.6"
# Only LF ends a line, as for TeX; CR stays in the line.
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
ropey = { version = "1.6", default-features = false, features = ["simd"] }
retex-texlive = "2.6"
retex-kpath = "2.6"
retex-synctex = "2.6"
# Figures for the editor pane: retex's own decoders (already built for retex), JPEG included.
retex-image = { version = "2.6", features = ["jxl"] }
png = "0.18"
# Geometry types of craft-pdf's page interpreter (MIT OR Apache-2.0), at the version it uses: the
# preview reads a page's glyphs through it.
kurbo = "0.13"
# SVG figures: rendered with their images (from the project) and the system's fonts.
resvg = { version = "0.48", default-features = false, features = ["raster-images", "text", "system-fonts", "memmap-fonts"] }

# internal
texcraft-project = { path = "crates/project" }
texcraft-latex = { path = "crates/latex" }
texcraft-compile = { path = "crates/compile", default-features = false }
texcraft-preview = { path = "crates/preview" }
texcraft-engine = { path = "crates/engine", default-features = false }
texcraft-ui-egui = { path = "crates/ui-egui" }
texcraft-mcp = { path = "crates/mcp" }
texcraft-buffer = { path = "crates/buffer" }
texcraft-vim = { path = "crates/vim" }
texcraft-templates = { path = "crates/templates", default-features = false }
texcraft-review = { path = "crates/review" }
texcraft-history = { path = "crates/history" }
texcraft-forge = { path = "crates/forge" }
texcraft-gitwire = { path = "crates/gitwire" }
texcraft-wasi = { path = "crates/wasi" }

# foundation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
tar = { version = "0.4", default-features = false }
# The control channel's token (random bytes) and its folder.
getrandom = "0.4"
dirs = "6"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Review ids (MIT).
ulid = { version = "3", default-features = false }
# The per-person key review authors carry (BSD-3-Clause).
ed25519-dalek = "2"

# ui
egui = "0.37"
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"
egui_extras = { version = "0.37", default-features = false }
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
# Shipped code never panics (AGENTS.md rule 13); tests may (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

# The browser build (apps/texcraft-web, `trunk build --release`): smaller code over speed, no debug
# information, every crate optimised as one unit, so the first download is as small as it can be.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
strip = true
debug = false
panic = "abort"

# The suite's egui and winit forks, and craft-libs' vendored hayro, at the revs craft-libs pins.
[patch.crates-io]
hayro = { git = "https://github.com/storytold/craft-libs", rev = "f8c3cef36fbf8f735b373b66c4f81911993aba1f" }
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "f8c3cef36fbf8f735b373b66c4f81911993aba1f" }
hayro-interpret = { git = "https://github.com/storytold/craft-libs", rev = "f8c3cef36fbf8f735b373b66c4f81911993aba1f" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "f8c3cef36fbf8f735b373b66c4f81911993aba1f" }
hayro-cmap = { git = "https://github.com/storytold/craft-libs", rev = "f8c3cef36fbf8f735b373b66c4f81911993aba1f" }
hayro-postscript = { git = "https://github.com/storytold/craft-libs", rev = "f8c3cef36fbf8f735b373b66c4f81911993aba1f" }
vello_common = { git = "https://github.com/storytold/craft-libs", rev = "f8c3cef36fbf8f735b373b66c4f81911993aba1f" }
vello_cpu = { git = "https://github.com/storytold/craft-libs", rev = "f8c3cef36fbf8f735b373b66c4f81911993aba1f" }
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
